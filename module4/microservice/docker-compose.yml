services:
  # 1. Database MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: microservice_db
    ports:
      - "3307:3306" # Map ra port 3307 ở máy thật để tránh đụng port 3306 nếu máy bạn đang cài MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Building Service
  building-service:
    build: ./building-service
    container_name: building-service
    restart: on-failure
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: microservice_db
    depends_on:
      mysql:
        condition: service_healthy

  # 3. User Service
  user-service:
    build: ./user-service
    container_name: user-service
    restart: on-failure
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: microservice_db
      BUILDING_SERVICE_URL: http://building-service:3002
    depends_on:
      mysql:
        condition: service_healthy
      building-service:
        condition: service_started

volumes:
  mysql_data: