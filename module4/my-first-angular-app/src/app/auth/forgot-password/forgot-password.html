<section class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <img src="/assets/images/angular-logo.png" alt="Logo Angular" width="100" />
            </div>
            <h1>Quên mật khẩu?</h1>
            <p>Nhập email của bạn để nhận đường dẫn đặt lại mật khẩu</p>
        </div>

        @if (isSubmitted()) {
        <div class="auth-alert">
            ✅ Đã gửi hướng dẫn khôi phục mật khẩu tới <strong>{{ email }}</strong>.
            Vui lòng kiểm tra hộp thư!
        </div>
        }

        <form (ngSubmit)="onResetPassword()">
            <div class="form-group">
                <label for="email">Email đăng ký</label>
                <input id="email" name="email" type="email" class="form-control" placeholder="ban@example.com"
                    [(ngModel)]="email" required />
            </div>

            <button type="submit" class="btn-submit">Gửi link khôi phục</button>
        </form>

        <div class="auth-footer">
            Nhớ mật khẩu rồi?
            <a routerLink="/login" class="auth-link">Quay lại đăng nhập</a>
        </div>
    </div>
</section>
