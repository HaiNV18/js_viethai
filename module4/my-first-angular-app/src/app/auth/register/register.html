<section class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <img src="/assets/images/angular-logo.png" alt="Logo Angular" width="100" />
            </div>
            <h1>Tạo tài khoản mới</h1>
            <p>Nhận ngay ưu đãi giảm 15% cho đơn hàng đầu tiên</p>
        </div>

        <form (ngSubmit)="onRegister()">
            <div class="form-group">
                <label for="fullName">Họ và tên</label>
                <input id="fullName" name="fullName" type="text" class="form-control" placeholder="Nguyễn Văn A"
                    [(ngModel)]="fullName" required />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" class="form-control" placeholder="ban@example.com"
                    [(ngModel)]="email" required />
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input id="password" name="password" type="password" class="form-control"
                    placeholder="Tối thiểu 6 ký tự" [(ngModel)]="password" required />
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input id="confirmPassword" name="confirmPassword" type="password" class="form-control"
                    placeholder="Nhập lại mật khẩu" [(ngModel)]="confirmPassword" required />
            </div>

            <button type="submit" class="btn-submit">Đăng ký tài khoản</button>
        </form>

        <div class="auth-footer">
            Đã có tài khoản?
            <a routerLink="/login" class="auth-link">Đăng nhập</a>
        </div>
    </div>
</section>
