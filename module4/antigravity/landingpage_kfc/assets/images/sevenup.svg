<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="sevGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafaf1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sevShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#555" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#fafafa"/>
  <circle cx="200" cy="150" r="130" fill="url(#sevGlow)"/>
  <ellipse cx="200" cy="260" rx="110" ry="15" fill="#eaecee"/>

  <!-- 7UP Cup with fresh lime aesthetic -->
  <g transform="translate(140, 45)" filter="url(#sevShadow)">
    <!-- Lime Green Straw -->
    <path d="M70 20 L55 -15 L35 -20" stroke="#2ecc71" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Plastic Lid -->
    <ellipse cx="60" cy="50" rx="58" ry="14" fill="#ffffff" stroke="#d5d8dc" stroke-width="2"/>
    <ellipse cx="60" cy="47" rx="54" ry="11" fill="#ecf0f1"/>

    <!-- Cup Body -->
    <path d="M8 50 L24 205 C24 210 40 215 60 215 C80 215 96 210 96 205 L112 50 Z" fill="#008844"/>

    <!-- 7UP Brand elements -->
    <g transform="translate(35, 100)">
      <text x="18" y="42" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" fill="#ffffff">7</text>
      <!-- Red Dot -->
      <circle cx="44" cy="28" r="12" fill="#d71920"/>
      <text x="44" y="32" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">UP</text>
    </g>

    <!-- Fresh Bubbles -->
    <circle cx="28" cy="80" r="3" fill="#a3e4d7" opacity="0.7"/>
    <circle cx="92" cy="95" r="4" fill="#a3e4d7" opacity="0.6"/>
    <circle cx="34" cy="170" r="3.5" fill="#a3e4d7" opacity="0.7"/>
    <circle cx="85" cy="180" r="2.5" fill="#a3e4d7" opacity="0.7"/>
  </g>
</svg>
