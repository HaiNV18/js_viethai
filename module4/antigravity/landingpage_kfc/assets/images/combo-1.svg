<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="cb1Glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cb1Shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#555" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#fafafa"/>
  <circle cx="200" cy="150" r="130" fill="url(#cb1Glow)"/>
  <ellipse cx="200" cy="255" rx="140" ry="16" fill="#eaecee"/>

  <!-- Drink Cup (Right) -->
  <g transform="translate(250, 70)" filter="url(#cb1Shadow)">
    <!-- Cup Body -->
    <path d="M15 70 L25 180 C25 183 40 188 65 188 C90 188 105 183 105 180 L115 70 Z" fill="#d71920"/>
    <ellipse cx="65" cy="70" rx="50" ry="12" fill="#ffffff"/>
    <ellipse cx="65" cy="67" rx="46" ry="10" fill="#ecf0f1"/>
    <!-- Lid and Straw -->
    <rect x="62" y="10" width="8" height="60" rx="3" fill="#e74c3c" transform="rotate(-15 65 30)"/>
    <!-- Logo band -->
    <rect x="25" y="110" width="80" height="30" fill="#ffffff" rx="4"/>
    <text x="65" y="132" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#d71920" text-anchor="middle">KFC</text>
  </g>

  <!-- French Fries (Middle/Back) -->
  <g transform="translate(145, 100)" filter="url(#cb1Shadow)">
    <!-- Red Box -->
    <path d="M10 70 L18 150 C18 153 35 156 55 156 C75 156 92 153 92 150 L100 70 Z" fill="#b8141a"/>
    <!-- Golden fries sticking out -->
    <rect x="18" y="15" width="10" height="70" rx="2" fill="#f4d03f" stroke="#d68910" stroke-width="1.5" transform="rotate(-12 23 50)"/>
    <rect x="35" y="5" width="11" height="80" rx="2" fill="#f5b041" stroke="#d68910" stroke-width="1.5" transform="rotate(-4 40 45)"/>
    <rect x="52" y="8" width="10" height="75" rx="2" fill="#f4d03f" stroke="#d68910" stroke-width="1.5" transform="rotate(6 57 45)"/>
    <rect x="68" y="20" width="11" height="65" rx="2" fill="#f5b041" stroke="#d68910" stroke-width="1.5" transform="rotate(14 73 50)"/>
    <!-- Box Front Arc -->
    <path d="M10 70 Q55 90 100 70 L92 150 C92 153 75 156 55 156 C35 156 18 153 18 150 Z" fill="#d71920"/>
  </g>

  <!-- Crispy Fried Chicken Drumstick (Front Left) -->
  <g transform="translate(40, 110)" filter="url(#cb1Shadow)">
    <rect x="145" y="45" width="16" height="50" rx="8" fill="#fdfefe" transform="rotate(35 150 70)"/>
    <circle cx="160" cy="55" r="10" fill="#fdfefe"/>
    <path d="M40 120 C10 85 25 35 75 35 C125 35 150 75 135 115 C120 145 75 145 40 120 Z" fill="#e67e22"/>
    <circle cx="80" cy="75" r="30" fill="#f39c12" opacity="0.6"/>
    <circle cx="60" cy="85" r="6" fill="#ba4a00" opacity="0.4"/>
    <circle cx="95" cy="80" r="8" fill="#ba4a00" opacity="0.4"/>
    <circle cx="80" cy="110" r="7" fill="#ba4a00" opacity="0.4"/>
    <circle cx="70" cy="65" r="2.5" fill="#27ae60"/>
    <circle cx="100" cy="95" r="2.5" fill="#27ae60"/>
  </g>
</svg>
