<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="c1Glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8c471"/>
      <stop offset="40%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#b9770e"/>
    </linearGradient>
    <filter id="c1Shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#b9770e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#fafafa"/>
  <circle cx="200" cy="150" r="130" fill="url(#c1Glow)"/>
  <ellipse cx="200" cy="245" rx="120" ry="16" fill="#eaecee"/>

  <!-- Crispy Drumstick -->
  <g transform="translate(10, -5)">
    <!-- Bone -->
    <rect x="250" y="80" width="22" height="65" rx="11" fill="#fcf3cf" stroke="#f0b27a" stroke-width="2"/>
    <circle cx="254" cy="80" r="14" fill="#fcf3cf" stroke="#f0b27a" stroke-width="2"/>
    <circle cx="274" cy="80" r="14" fill="#fcf3cf" stroke="#f0b27a" stroke-width="2"/>

    <!-- Meat body -->
    <path d="M120 220 C70 190 70 120 120 90 C170 60 230 100 240 150 C250 200 180 250 120 220 Z" fill="url(#c1Grad)" filter="url(#c1Shadow)"/>
    <!-- Crispy crunch textures -->
    <circle cx="130" cy="120" r="8" fill="#d35400" opacity="0.4"/>
    <circle cx="160" cy="100" r="12" fill="#f39c12" opacity="0.7"/>
    <circle cx="180" cy="140" r="15" fill="#f8c471" opacity="0.6"/>
    <circle cx="140" cy="160" r="10" fill="#d35400" opacity="0.4"/>
    <circle cx="190" cy="180" r="9" fill="#ba4a00" opacity="0.4"/>
    <circle cx="100" cy="150" r="7" fill="#ba4a00" opacity="0.3"/>
    <circle cx="150" cy="190" r="11" fill="#f39c12" opacity="0.6"/>

    <!-- Herb garnish -->
    <circle cx="140" cy="130" r="3" fill="#27ae60"/>
    <circle cx="170" cy="160" r="3.5" fill="#27ae60"/>
    <circle cx="120" cy="170" r="2.5" fill="#27ae60"/>
    <circle cx="180" cy="115" r="3" fill="#27ae60"/>
  </g>
</svg>
