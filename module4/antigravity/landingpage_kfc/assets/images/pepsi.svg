<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="pepGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ebf5fb"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#555" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#fafafa"/>
  <circle cx="200" cy="150" r="130" fill="url(#pepGlow)"/>
  <ellipse cx="200" cy="260" rx="110" ry="15" fill="#eaecee"/>

  <!-- Pepsi Cup -->
  <g transform="translate(140, 45)" filter="url(#drShadow)">
    <!-- Red Bendy Straw -->
    <path d="M70 20 L55 -15 L35 -20" stroke="#e74c3c" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Plastic Lid -->
    <ellipse cx="60" cy="50" rx="58" ry="14" fill="#ffffff" stroke="#d5d8dc" stroke-width="2"/>
    <ellipse cx="60" cy="47" rx="54" ry="11" fill="#ecf0f1"/>

    <!-- Cup Body -->
    <path d="M8 50 L24 205 C24 210 40 215 60 215 C80 215 96 210 96 205 L112 50 Z" fill="#005db9"/>

    <!-- Pepsi Wave/Globe Logo -->
    <g transform="translate(30, 95)">
      <circle cx="30" cy="30" r="28" fill="#ffffff"/>
      <!-- Red Top Wave -->
      <path d="M4 25 C12 10 32 15 56 22 A 28 28 0 0 0 4 25 Z" fill="#d71920"/>
      <!-- Blue Bottom Wave -->
      <path d="M4 35 C20 45 44 38 56 32 A 28 28 0 0 1 4 35 Z" fill="#005db9"/>
    </g>

    <!-- Brand Text -->
    <text x="60" y="180" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">PEPSI</text>

    <!-- Refreshing condensation drops -->
    <circle cx="25" cy="80" r="2.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="95" cy="110" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="30" cy="160" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="90" cy="170" r="2.5" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
