<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="frGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="frShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#555" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#fafafa"/>
  <circle cx="200" cy="150" r="130" fill="url(#frGlow)"/>
  <ellipse cx="200" cy="255" rx="120" ry="16" fill="#eaecee"/>

  <!-- French Fries Packet -->
  <g transform="translate(135, 50)" filter="url(#frShadow)">
    <!-- Back Fries -->
    <rect x="25" y="15" width="14" height="110" rx="3" fill="#f4d03f" stroke="#d68910" stroke-width="1.5" transform="rotate(-15 32 60)"/>
    <rect x="50" y="5" width="15" height="120" rx="3" fill="#f5b041" stroke="#d68910" stroke-width="1.5" transform="rotate(-6 57 60)"/>
    <rect x="75" y="8" width="14" height="115" rx="3" fill="#f4d03f" stroke="#d68910" stroke-width="1.5" transform="rotate(4 82 60)"/>
    <rect x="98" y="20" width="15" height="105" rx="3" fill="#f5b041" stroke="#d68910" stroke-width="1.5" transform="rotate(16 105 60)"/>

    <!-- Middle Fries -->
    <rect x="38" y="25" width="14" height="95" rx="3" fill="#f7dc6f" stroke="#d68910" stroke-width="1.5" transform="rotate(-10 45 60)"/>
    <rect x="62" y="18" width="15" height="100" rx="3" fill="#f5b041" stroke="#d68910" stroke-width="1.5" transform="rotate(1 69 60)"/>
    <rect x="85" y="28" width="14" height="90" rx="3" fill="#f7dc6f" stroke="#d68910" stroke-width="1.5" transform="rotate(10 92 60)"/>

    <!-- Red Carton Body -->
    <path d="M15 100 Q65 130 115 100 L102 205 C102 210 82 214 65 214 C48 214 28 210 28 205 Z" fill="#d71920"/>
    
    <!-- White Logo Band / Badge -->
    <rect x="35" y="145" width="60" height="30" rx="4" fill="#ffffff"/>
    <text x="65" y="167" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#d71920" text-anchor="middle">KFC</text>
  </g>
</svg>
