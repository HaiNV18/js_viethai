<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="popGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="popShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#555" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#fafafa"/>
  <circle cx="200" cy="150" r="130" fill="url(#popGlow)"/>
  <ellipse cx="200" cy="255" rx="120" ry="16" fill="#eaecee"/>

  <!-- Popcorn Chicken Box and Bite-sized Nuggets -->
  <g transform="translate(120, 60)" filter="url(#popShadow)">
    <!-- Overflowing popcorn nuggets -->
    <ellipse cx="60" cy="65" rx="14" ry="12" fill="#e67e22"/>
    <ellipse cx="85" cy="55" rx="16" ry="13" fill="#f39c12"/>
    <ellipse cx="110" cy="62" rx="15" ry="13" fill="#d35400"/>
    <ellipse cx="50" cy="80" rx="13" ry="12" fill="#f5b041"/>
    <ellipse cx="75" cy="75" rx="15" ry="14" fill="#e67e22"/>
    <ellipse cx="100" cy="80" rx="16" ry="13" fill="#f39c12"/>
    <ellipse cx="125" cy="75" rx="14" ry="12" fill="#d68910"/>

    <!-- Pepper & Herbs sprinkles on top nuggets -->
    <circle cx="85" cy="52" r="1.5" fill="#27ae60"/>
    <circle cx="62" cy="65" r="1.5" fill="#27ae60"/>
    <circle cx="108" cy="60" r="1.5" fill="#27ae60"/>
    <circle cx="75" cy="73" r="1.5" fill="#27ae60"/>

    <!-- Box Base -->
    <path d="M25 85 L40 180 C40 184 55 188 80 188 C105 188 120 184 120 180 L135 85 Z" fill="#d71920"/>
    <!-- White center stripe -->
    <path d="M65 85 L70 187 C73 188 77 188 80 188 C83 188 87 188 90 187 L95 85 Z" fill="#ffffff"/>
    
    <!-- Box Lip -->
    <ellipse cx="80" cy="85" rx="55" ry="12" fill="#b8141a"/>

    <!-- Popcorn Badge -->
    <rect x="50" y="115" width="60" height="26" rx="4" fill="#ffffff"/>
    <text x="80" y="133" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#d71920" text-anchor="middle">POPCORN</text>
  </g>

  <!-- A few fallen crunchy nuggets in foreground -->
  <g transform="translate(190, 230)">
    <ellipse cx="20" cy="15" rx="14" ry="11" fill="#e67e22"/>
    <circle cx="20" cy="13" r="1.5" fill="#27ae60"/>
    <ellipse cx="50" cy="18" rx="12" ry="9" fill="#f39c12"/>
  </g>
</svg>
