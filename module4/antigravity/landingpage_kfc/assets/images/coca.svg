<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="cocGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdedec"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cocShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#555" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#fafafa"/>
  <circle cx="200" cy="150" r="130" fill="url(#cocGlow)"/>
  <ellipse cx="200" cy="260" rx="110" ry="15" fill="#eaecee"/>

  <!-- Coca Cola Cup -->
  <g transform="translate(140, 45)" filter="url(#cocShadow)">
    <!-- Red Bendy Straw -->
    <path d="M70 20 L55 -15 L35 -20" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Plastic Lid -->
    <ellipse cx="60" cy="50" rx="58" ry="14" fill="#ffffff" stroke="#d5d8dc" stroke-width="2"/>
    <ellipse cx="60" cy="47" rx="54" ry="11" fill="#ecf0f1"/>

    <!-- Cup Body -->
    <path d="M8 50 L24 205 C24 210 40 215 60 215 C80 215 96 210 96 205 L112 50 Z" fill="#e71d36"/>

    <!-- Dynamic Coca-Cola wave line -->
    <path d="M15 125 Q60 145 105 120" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.9"/>
    <path d="M20 135 Q60 155 100 132" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- Brand Script Text -->
    <text x="60" y="115" font-family="'Georgia', serif" font-weight="bold" font-style="italic" font-size="20" fill="#ffffff" text-anchor="middle">Coca-Cola</text>

    <!-- Bubbles -->
    <circle cx="25" cy="80" r="2.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="95" cy="100" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="30" cy="165" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="90" cy="175" r="2.5" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
