<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách Tour Du lịch – Vietjet (Demo)</title>
  <meta name="description" content="Khám phá các tour du lịch trong nước và quốc tế trọn gói kèm vé máy bay trên Vietjet Demo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="py-4">
    <div class="container">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
        <div>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb small mb-1">
              <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
              <li class="breadcrumb-item active" aria-current="page">Tour du lịch</li>
            </ol>
          </nav>
          <h1 class="h3 fw-bold mb-0">Danh Sách Tour Du Lịch Trọn Gói</h1>
        </div>

        <button
          class="btn btn-vj-outline d-lg-none"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#mobileToursFilterOffcanvas"
          aria-controls="mobileToursFilterOffcanvas"
        >
          <i class="bi bi-funnel-fill text-danger me-1"></i>Bộ lọc Tour
        </button>
      </div>

      <div class="row g-4">
        <!-- Sidebar Filter (Desktop) -->
        <aside class="col-lg-3 d-none d-lg-block" aria-label="Bộ lọc tour du lịch">
          <div class="filter-sidebar filter-sidebar-sticky">
            <div class="d-flex align-items-center justify-content-between pb-2 mb-3 border-bottom">
              <h2 class="h6 fw-bold mb-0"><i class="bi bi-sliders text-danger me-1"></i>Bộ lọc Tour</h2>
              <button type="button" class="btn btn-link btn-sm text-danger p-0 fw-semibold btn-reset-tour-filters">
                Xóa bộ lọc
              </button>
            </div>

            <!-- Sắp xếp giá -->
            <div class="mb-3">
              <label for="dt-tour-sort" class="form-label small fw-bold">Sắp xếp theo giá</label>
              <select id="dt-tour-sort" class="form-select form-select-sm tour-filter-sort">
                <option value="asc">Giá tour: Thấp đến cao</option>
                <option value="desc">Giá tour: Cao đến thấp</option>
              </select>
            </div>

            <!-- Điểm đến -->
            <div class="mb-3">
              <label for="dt-tour-dest" class="form-label small fw-bold">Điểm đến</label>
              <select id="dt-tour-dest" class="form-select form-select-sm tour-filter-destination">
                <option value="">Tất cả điểm đến</option>
              </select>
            </div>

            <!-- Hãng hàng không -->
            <div class="mb-3">
              <div class="small fw-bold mb-1">Hãng hàng không đồng hành</div>
              <div data-tour-airline-filter="desktop"></div>
            </div>

            <!-- Thời gian khởi hành (giờ) -->
            <div class="mb-4">
              <div class="small fw-bold mb-1">Khung giờ khởi hành</div>
              <div class="form-check">
                <input class="form-check-input tour-filter-timeslot" type="checkbox" value="morning" id="dt-tour-time-morning">
                <label class="form-check-label small" for="dt-tour-time-morning">Buổi sáng (00:00 – 10:59)</label>
              </div>
              <div class="form-check">
                <input class="form-check-input tour-filter-timeslot" type="checkbox" value="noon" id="dt-tour-time-noon">
                <label class="form-check-label small" for="dt-tour-time-noon">Buổi trưa (11:00 – 13:59)</label>
              </div>
              <div class="form-check">
                <input class="form-check-input tour-filter-timeslot" type="checkbox" value="afternoon" id="dt-tour-time-afternoon">
                <label class="form-check-label small" for="dt-tour-time-afternoon">Buổi chiều (14:00 – 17:59)</label>
              </div>
              <div class="form-check">
                <input class="form-check-input tour-filter-timeslot" type="checkbox" value="evening" id="dt-tour-time-evening">
                <label class="form-check-label small" for="dt-tour-time-evening">Buổi tối (18:00 – 23:59)</label>
              </div>
            </div>

            <button type="button" class="btn btn-vj-outline btn-sm w-100 btn-reset-tour-filters">
              <i class="bi bi-arrow-counterclockwise me-1"></i>Đặt lại bộ lọc
            </button>
          </div>
        </aside>

        <!-- Danh sách Tour -->
        <section class="col-12 col-lg-9" aria-label="Danh sách tour">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3 p-3 rounded-3 bg-light border">
            <div>
              Đang hiển thị <strong id="tours-result-count" class="text-danger fs-5">0</strong> tour du lịch
            </div>
            <span class="badge-demo">Đã bao gồm vé máy bay minh họa</span>
          </div>

          <div id="tours-list-container" class="row g-4">
            <div class="col-12 text-center py-5">
              <div class="spinner-border text-danger" role="status"></div>
              <p class="small text-secondary mt-2 mb-0">Đang tải danh sách tour từ SQLite...</p>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- Offcanvas Bộ lọc Tour cho Mobile -->
  <div
    class="offcanvas offcanvas-start"
    tabindex="-1"
    id="mobileToursFilterOffcanvas"
    aria-labelledby="mobileToursFilterLabel"
  >
    <div class="offcanvas-header border-bottom">
      <h2 class="offcanvas-title h6 fw-bold" id="mobileToursFilterLabel">
        <i class="bi bi-funnel-fill text-danger me-1"></i>Bộ lọc Tour du lịch
      </h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Đóng bộ lọc"></button>
    </div>
    <div class="offcanvas-body">
      <div class="mb-3">
        <label for="mb-tour-sort" class="form-label small fw-bold">Sắp xếp theo giá</label>
        <select id="mb-tour-sort" class="form-select form-select-sm tour-filter-sort">
          <option value="asc">Giá tour: Thấp đến cao</option>
          <option value="desc">Giá tour: Cao đến thấp</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="mb-tour-dest" class="form-label small fw-bold">Điểm đến</label>
        <select id="mb-tour-dest" class="form-select form-select-sm tour-filter-destination">
          <option value="">Tất cả điểm đến</option>
        </select>
      </div>

      <div class="mb-3">
        <div class="small fw-bold mb-1">Hãng hàng không đồng hành</div>
        <div data-tour-airline-filter="mobile"></div>
      </div>

      <div class="mb-4">
        <div class="small fw-bold mb-1">Khung giờ khởi hành</div>
        <div class="form-check">
          <input class="form-check-input tour-filter-timeslot" type="checkbox" value="morning" id="mb-tour-time-morning">
          <label class="form-check-label small" for="mb-tour-time-morning">Buổi sáng (00:00 – 10:59)</label>
        </div>
        <div class="form-check">
          <input class="form-check-input tour-filter-timeslot" type="checkbox" value="noon" id="mb-tour-time-noon">
          <label class="form-check-label small" for="mb-tour-time-noon">Buổi trưa (11:00 – 13:59)</label>
        </div>
        <div class="form-check">
          <input class="form-check-input tour-filter-timeslot" type="checkbox" value="afternoon" id="mb-tour-time-afternoon">
          <label class="form-check-label small" for="mb-tour-time-afternoon">Buổi chiều (14:00 – 17:59)</label>
        </div>
        <div class="form-check">
          <input class="form-check-input tour-filter-timeslot" type="checkbox" value="evening" id="mb-tour-time-evening">
          <label class="form-check-label small" for="mb-tour-time-evening">Buổi tối (18:00 – 23:59)</label>
        </div>
      </div>

      <div class="d-grid gap-2">
        <button type="button" class="btn btn-vj-primary" data-bs-dismiss="offcanvas">Xem kết quả</button>
        <button type="button" class="btn btn-vj-outline btn-reset-tour-filters">Xóa bộ lọc</button>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module" src="assets/js/tours.js"></script>
</body>
</html>
