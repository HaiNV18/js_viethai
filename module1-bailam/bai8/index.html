<html>
    <head>
        <title>JS</title>
        <style>
            #demo{color:red;}
            .post{font-weight:bold;}
        </style>
    </head>
    <body>
        <table border="1" width="400">
            <thead>
                <tr>
                    <th>Tên</th>
                    <th>Giá</th>
                    <th>Số lượng</th>
                </tr>
            </thead>
            <tbody id="cart-table"></tbody>
        </table>

        <script>
            // Tạo dữ liệu giỏ hàng (dang mang array)
            var cart = [
                { name: "Laptop", price: 1500, qty: 1 },
                { name: "Mouse", price: 25, qty: 2 },
                { name: "Keyboard", price: 70, qty: 1 }
            ];
            
            // Lưu vào localStorage
            localStorage.setItem("cart", JSON.stringify(cart));

            // Lấy dữ liệu ra
            var cartData = JSON.parse(localStorage.getItem("cart")) || [];

            var tableBody = document.getElementById("cart-table");
            let html = "";

            cartData.forEach(item => {
                html += `
                    <tr>
                        <th>${item.name}</th>
                        <th>${item.price}</th>
                        <th>${item.qty}</th>
                    </tr>
                `;    
            });
            tableBody.innerHTML = html;

        </script>
    </body>
</html>
