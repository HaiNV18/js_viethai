<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter Animation</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f5f5;
}

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    font-weight:bold;
}

.stats{
    background:white;
    padding:80px 0;
}

.counter{
    font-size:60px;
    font-weight:bold;
    color:#0d6efd;
}

.item p{
    font-size:20px;
    margin-top:10px;
}
</style>

</head>
<body>

<div class="hero">
    Số tăng từ 0 đến data-target
	https://evodrive.templines.com/
</div>

<section class="stats">
    <div class="container">
        <div class="row text-center">

            <div class="col-md-4 item">
                <div class="counter" data-target="2400">0</div>
                <p>Happy Customers</p>
            </div>

            <div class="col-md-4 item">
                <div class="counter" data-target="120">0</div>
                <p>Vehicles Available</p>
            </div>

            <div class="col-md-4 item">
                <div class="counter" data-target="15">0</div>
                <p>Years in Business</p>
            </div>

        </div>
    </div>
</section>

<script>

function animateCounter(counter){

    const target = +counter.dataset.target;
    const duration = 2000; // Thời gian nhảy số từ 0 đến max
    const startTime = performance.now();

    function update(currentTime){

        const elapsed = currentTime - startTime;

        const progress = Math.min(elapsed / duration, 1);

        const value = Math.floor(progress * target);

        counter.textContent = value.toLocaleString();

        if(progress < 1){
            requestAnimationFrame(update);
        }else{
            counter.textContent = target.toLocaleString() + "+";
        }
    }

    requestAnimationFrame(update);
}

const observer = new IntersectionObserver((entries)=>{

    entries.forEach(entry=>{
        if(entry.isIntersecting){
            document.querySelectorAll(".counter").forEach(counter=>{

                if(!counter.classList.contains("done")){
                    animateCounter(counter);
                    counter.classList.add("done");
                }

            });
        }
    });

},{threshold:0.5});

observer.observe(document.querySelector(".stats"));

</script>

</body>
</html>
