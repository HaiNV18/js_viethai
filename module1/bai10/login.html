<!DOCTYPE html>
<html>

<head>
    <title>About - Start Bootstrap</title>
    <link rel="stylesheet" type="text/css" href="asset/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="https://getbootstrap.com/docs/5.0/examples/sign-in/signin.css">
</head>

<body class="text-center">

    <main class="form-signin">
        <form id="formLogin">
            <img class="mb-4" src="https://getbootstrap.com/docs/5.0/assets/brand/bootstrap-logo.svg" alt="" width="72" height="57">
            <h1 class="h3 mb-3 fw-normal">Please sign in</h1>

            <p id="error-message" class="text-danger"></p>

            <div class="form-floating">
                <input type="text" class="form-control" id="floatingInput" name="username" placeholder="Username">
                <label for="floatingInput">Username</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="floatingPassword" name="password" placeholder="Password">
                <label for="floatingPassword">Password</label>
            </div>

            <div class="checkbox mb-3">
                <label>
                    <input type="checkbox" value="remember-me"> Remember me
                </label>
            </div>
            <button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button>
            <p class="mt-5 mb-3 text-muted">© 2017–2021
                <a href="https://getbootstrap.com/docs/5.3/examples/" target="_blank">Bootstrap Examples</a>
            </p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var users = [];
        window.onload = function() {
            loadUser();
        }

        // Get data
        function loadUser() {
            let xhr = new XMLHttpRequest;
            xhr.open("GET", "users.json", true);

            xhr.onload = function() {
                if (xhr.status == 200) {
                    users = JSON.parse(xhr.responseText);
                    console.log(users)
                }
            }
            xhr.send();
        }

        const formElement = document.querySelector("#formLogin");

        formElement.addEventListener('submit', (e) => {
            e.preventDefault(); // Chặn việc form tự động gửi thông tin
            let data = new FormData(formElement);

            let username = data.get('username');
            let password = data.get('password');

            if (username == null || username == undefined || username == "") {
                document.getElementById("error-message").innerHTML = "Bạn chưa nhập tên đăng nhập";
            } else if (password == null || password == undefined || password == "") {
                document.getElementById("error-message").innerHTML = "Bạn chưa nhập mật khẩu";
            } else {

                users.forEach(user => {
                    if (user.username == username && user.password == password) {
                        localStorage.setItem("username", username);
                        window.location.href = "dashboard.html";
                    } else {
                        document.getElementById("error-message").innerHTML = "Sai tên đăng nhập hoặc mật khẩu";
                    }
                })

            }
        })
    </script>
</body>

</html>
