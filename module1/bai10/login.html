<!DOCTYPE html>
<html>
<head>
    <title>Login - Start Bootstrap</title>
    <link rel="stylesheet" type="text/css" href="asset/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="https://getbootstrap.com/docs/5.3/examples/sign-in/sign-in.css">
</head>

<body class="d-flex align-items-center py-4 bg-body-tertiary text-center">

    <main class="form-signin w-100 m-auto">
        <form id="formLogin">
            <img class="mb-4" src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo.svg" alt="" width="72" height="57">
            <h1 class="h3 mb-3 fw-normal">Please sign in</h1>

            <p id="error-message" class="text-danger"></p>

            <div class="form-floating">
                <input type="username" class="form-control" id="floatingInput" name="username" placeholder="name@example.com">
                <label for="floatingInput">Email address</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="floatingPassword" name="password" placeholder="Password">
                <label for="floatingPassword">Password</label>
            </div>
            <div class="form-check text-start my-3">
                <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault">
                <label class="form-check-label" for="checkDefault">
                    Remember me
                </label>
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit">Sign in</button>
            <p class="mt-2 text-center"><a href="forgot-password.html" target="_blank">Forgot password?</a></p>
            <p class="mt-5 mb-3 text-body-secondary">
                © 2017 - 2025
                <a href="https://getbootstrap.com/docs/5.3/examples/" target="_blank">Bootstrap Examples</a>
            </p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="asset/js/user.js"></script>

    <script>
        const formElement = document.querySelector("#formLogin");
        var users = [];

        window.onload = function() {
            checkMessage();
            loadUser();
        }

        formElement.addEventListener('submit', (e) => {
            e.preventDefault();
            let data = new FormData(formElement);

            let username = data.get('username');
            let password = data.get('password');

            // so sánh username, password với mảng users
            if (username == null || username == undefined || username == "") {
                document.getElementById("error-message").innerHTML = "Bạn chưa nhập tên đăng nhập";
            } else if (password == null || password == undefined || password == "") {
                document.getElementById("error-message").innerHTML = "Bạn chưa nhập mật khẩu";
            } else {

                users.forEach(item => {
                    if (item.username == username && item.password == password) {
                        localStorage.setItem('username', username);
                        window.location.href = "dashboard.html";
                    }
                })

            }
        })

        function checkMessage() {
            let msgSuccess = localStorage.getItem('message-success');
            if (msgSuccess != null && msgSuccess != undefined && msgSuccess != "") {
                document.getElementById("error-message").innerHTML = msgSuccess;
            }
            localStorage.removeItem('message-success');
        }

    </script>
</body>

</html>
