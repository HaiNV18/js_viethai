<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo jQuery Active Menu</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        /* Menu */
        .menu{
            display:flex;
            justify-content:center;
            list-style:none;
            background:#222;
        }

        .menu li a{
            display:block;
            padding:18px 30px;
            color:#fff;
            text-decoration:none;
            transition:.3s;
        }

        .menu li a:hover{
            background:#444;
        }

        /* Menu đang được chọn */
        .menu li a.active{
            background:#007bff;
            color:#fff;
        }

        .content{
            text-align:center;
            margin-top:60px;
            font-size:28px;
            color:#333;
        }
    </style>
</head>
<body>

    <ul class="menu">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <div class="content">
        <h2>Demo đổi màu menu bằng jQuery</h2>
        <p>Click vào Home, About hoặc Contact để xem hiệu ứng.</p>
    </div>

    <script>
        $(function(){

            $(".menu a").click(function(e){
                e.preventDefault();

                // Xóa active khỏi tất cả menu
                $(".menu a").removeClass("active");

                // Thêm active cho menu được click
                $(this).addClass("active");
            });

        });
    </script>

</body>
</html>
