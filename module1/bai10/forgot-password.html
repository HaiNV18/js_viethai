<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - Start Bootstrap</title>
    <link rel="stylesheet" type="text/css" href="asset/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="https://getbootstrap.com/docs/5.3/examples/sign-in/sign-in.css">
</head>

<body class="d-flex align-items-center py-4 bg-body-tertiary text-center">

    <main class="form-signin w-100 m-auto">
        <form id="formForgot">
            <img class="mb-4" src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo.svg" alt="" width="72" height="57">
            <h1 class="h3 mb-3 fw-normal">Forgot Password</h1>

            <p id="error-message" class="text-danger"></p>

            <div class="form-floating">
                <input type="email" class="form-control" id="floatingInput" name="email" placeholder="name@example.com">
                <label for="floatingInput">Email address</label>
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit">Send new password</button>

            <p class="mt-2 text-center"><a href="login.html" target="_blank">Already have account?</a></p>
            <p class="mt-5 mb-3 text-body-secondary">
                © 2017 - 2025
                <a href="https://getbootstrap.com/docs/5.3/examples/" target="_blank">Bootstrap Examples</a>
            </p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="asset/js/user.js"></script>

    <script>
        const formElement = document.querySelector("#formForgot");
        var users = [];

        window.onload = function() {
            loadUser();
        }

        formElement.addEventListener('submit', (e) => {
            e.preventDefault();
            let data = new FormData(formElement);

            let email = data.get('email');
            // so sánh email với mảng users
            if (email == null || email == undefined || email == "") {
                document.getElementById("error-message").innerHTML = "Bạn chưa nhập email";
            } else {
                let isExist = false;
                users.forEach(item => {
                    if (item.email == email) {
                        isExist = true;
                        localStorage.setItem('message-success', "Đã gửi thành công");
                        window.location.href = "login.html";
                    }
                })

                if (isExist == false) {
                    document.getElementById("error-message").innerHTML = "Email không tồn tại";
                }

            }
        })

    </script>
</body>

</html>
